name: Update SPTV playlist

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types:
      - refresh-sptv
      - trigger-sptv-from-cronjob
      - trigger-ththethao-from-cronjob

permissions:
  contents: write

concurrency:
  group: sptv-api-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch fresh SPTV keys through API
        env:
          SPTV_DELAY_MIN_SECONDS: "4.0"
          SPTV_DELAY_MAX_SECONDS: "5.5"
          SPTV_NETWORK_RETRIES: "1"
          SPTV_STOP_AFTER_DENIALS: "2"
          SPTV_MIN_REAL_STREAMS: "1"
          SPTV_MIN_TTL_SECONDS: "300"
          SPTV_PRESERVE_OLD_MIN_TTL_SECONDS: "60"
          SPTV_EXPIRY_CLOCK_SKEW_SECONDS: "30"
          SPTV_INCLUDE_PLACEHOLDERS: "0"
          SPTV_EMIT_HEADERS: "0"
        run: python sptv_api.py --output sptv.m3u --debug debug/sptv_debug.json

      - name: Audit output and key expiry
        run: python audit_m3u.py sptv.m3u --strict --allow-empty --min-remaining-seconds 30

      - name: Write update marker
        run: date -u +'%Y-%m-%dT%H:%M:%SZ' > lastupdated.txt

      - name: Commit changed playlist
        run: |
          git config user.name "sptv-api-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sptv.m3u debug/sptv_debug.json lastupdated.txt
          if git diff --cached --quiet; then
            echo "No playlist change."
            exit 0
          fi
          git commit -m "Refresh SPTV keys"
          git pull --rebase
          git push
